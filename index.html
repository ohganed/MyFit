<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="MyFit"><link rel="apple-touch-icon" href="icons/icon-180.png"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"><title>MyFit</title></head><body><div class="app-shell"><header class="topbar"><div><p class="eyebrow">PERSONAL TRAINING LOG</p><h1>MyFit</h1></div><div class="elapsed-wrap"><span>経過時間</span><strong id="elapsedTime">00:00</strong></div></header><main><section id="todayView" class="view active"><div class="card hero"><div><p class="muted">今日のトレーニング</p><h2 id="todayDate"></h2></div><button id="startWorkoutBtn" class="primary">開始する</button></div><div id="workoutPanel" class="hidden"><section class="card"><div class="section-title-row"><h3>種目</h3><button id="addExerciseBtn" class="ghost small">＋追加</button></div><select id="exerciseSelect"></select><p id="previousRecord" class="previous">前回記録はありません</p></section><section class="card"><h3>今回のセット</h3><div id="standardInputs" class="input-grid"><label>重量<div class="input-unit"><input id="weightInput" inputmode="decimal" type="number" min="0" step="0.5"><span>kg</span></div></label><label>回数<div class="input-unit"><input id="repsInput" inputmode="numeric" type="number" min="1" step="1"><span>回</span></div></label></div><div id="bodyweightInputs" class="input-grid hidden"><label>回数<div class="input-unit"><input id="bodyweightRepsInput" inputmode="numeric" type="number" min="1" step="1"><span>回</span></div></label></div><div id="sidedInputs" class="hidden"><div class="input-grid"><label>右 重量<div class="input-unit"><input id="rightWeightInput" inputmode="decimal" type="number" min="0" step="0.5"><span>kg</span></div></label><label>右 回数<div class="input-unit"><input id="rightRepsInput" inputmode="numeric" type="number" min="1"><span>回</span></div></label><label>左 重量<div class="input-unit"><input id="leftWeightInput" inputmode="decimal" type="number" min="0" step="0.5"><span>kg</span></div></label><label>左 回数<div class="input-unit"><input id="leftRepsInput" inputmode="numeric" type="number" min="1"><span>回</span></div></label></div></div><label class="memo-label">メモ<textarea id="setMemo" rows="2"></textarea></label><button id="completeSetBtn" class="primary full">セット完了</button></section><section class="card"><div class="section-title-row"><h3>記録済みセット</h3><span id="setCountBadge" class="badge">0セット</span></div><div id="setsList" class="empty">まだ記録がありません</div></section><section class="card timer-card"><p class="muted">休憩タイマー</p><div id="restTimer" class="timer">01:30</div><div class="button-row"><button id="minus30Btn" class="ghost">−30秒</button><button id="toggleTimerBtn" class="secondary">開始</button><button id="plus30Btn" class="ghost">＋30秒</button></div></section><button id="finishWorkoutBtn" class="danger-outline full">トレーニング終了</button></div></section><section id="historyView" class="view"><div class="section-title-row page-heading"><div><p class="eyebrow">HISTORY</p><h2>トレーニング履歴</h2></div><button id="exportBtn" class="ghost small">書き出し</button></div><div id="historyList"></div></section><section id="exercisesView" class="view"><div class="page-heading"><p class="eyebrow">EXERCISES</p><h2>種目管理</h2></div><form id="exerciseForm" class="card"><label>種目名<input id="exerciseNameInput" required></label><label>記録形式<select id="exerciseTypeInput"><option value="standard">重量＋回数</option><option value="bodyweight">自重（回数のみ）</option><option value="sided">左右別</option></select></label><label>標準休憩時間<select id="restSecondsInput"><option value="60">60秒</option><option value="90" selected>90秒</option><option value="120">120秒</option><option value="180">180秒</option></select></label><button class="primary full" type="submit">種目を登録</button></form><div id="exerciseList"></div></section><section id="settingsView" class="view"><div class="page-heading"><p class="eyebrow">SETTINGS</p><h2>設定</h2></div><div class="card"><h3>データ管理</h3><p class="muted">記録はこの端末のブラウザ内に保存されます。</p><label class="file-button">バックアップを読み込む<input id="importInput" type="file" accept="application/json"></label><button id="resetBtn" class="danger-outline full">すべてのデータを削除</button></div><div class="card"><h3>ホーム画面への追加</h3><p class="muted">Safariの共有ボタンから「ホーム画面に追加」を選んでください。</p></div></section></main><nav class="bottom-nav"><button data-view="todayView" class="active"><span>●</span>今日</button><button data-view="historyView"><span>▤</span>履歴</button><button data-view="exercisesView"><span>＋</span>種目</button><button data-view="settingsView"><span>⚙</span>設定</button></nav></div><dialog id="summaryDialog"><div class="dialog-content"><p class="eyebrow">WORKOUT COMPLETE</p><h2>お疲れさまでした</h2><div id="summaryContent"></div><button id="closeSummaryBtn" class="primary full">閉じる</button></div></dialog><script src="storage-layer.js"></script><script src="storage-diagnostics.js"></script><script src="app.js"></script><script src="terminology.js"></script><script src="fast-set.js"></script><script src="beginner-ui.js"></script><script src="locale-ui.js"></script><script src="compact-workout.js"></script><script src="workout-coach.js"></script><script src="timer-overlay.js"></script><script src="storage-diagnostics-ui.js"></script></body></html>
