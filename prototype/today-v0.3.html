<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MyFit Today Prototype v0.3</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--soft:#eef2f7;--event:#7c3aed}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}button{font:inherit}.app{height:100dvh;max-width:480px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 12px calc(76px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}.header{display:flex;justify-content:space-between;align-items:flex-start}.brand small{display:block;color:var(--muted);font-weight:800;letter-spacing:.12em;font-size:10px}.brand h1{font-size:25px;line-height:1;margin:3px 0}.tagline{font-size:12px;color:var(--muted)}.ghost{border:0;background:#fff;border-radius:999px;padding:8px 11px;font-weight:800;box-shadow:0 2px 10px rgba(17,24,39,.06)}
.tabs,.days{display:grid;background:#e9edf2;border-radius:14px;padding:3px}.tabs{grid-template-columns:1fr 1fr}.days{grid-template-columns:repeat(7,1fr)}.tab,.day{border:0;background:transparent;border-radius:11px;padding:8px 4px;font-weight:900;color:#6b7280;font-size:12px}.tab.active,.day.active{background:#fff;color:#111827;box-shadow:0 1px 5px rgba(17,24,39,.08)}.panel{display:none;min-height:0;flex:1}.panel.active{display:flex;flex-direction:column;gap:8px}.card{background:#fff;border-radius:18px;padding:12px;box-shadow:0 2px 12px rgba(17,24,39,.05)}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.metric{border:1px solid var(--line);border-radius:13px;padding:9px 7px;min-width:0}.metric small{display:block;font-size:10px;color:var(--muted);font-weight:800}.metric strong{display:block;font-size:15px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.band{height:4px;background:#edf0f4;border-radius:99px;margin-top:7px;position:relative}.usualband{position:absolute;left:25%;right:20%;top:0;bottom:0;background:#cbd5e1;border-radius:99px}.dot{position:absolute;width:7px;height:7px;border-radius:50%;background:#111827;top:50%;transform:translateY(-50%)}
.notice{display:flex;align-items:center;gap:9px;border:1px solid #ddd6fe;background:#faf5ff}.notice.hidden{display:none}.diamond{width:13px;height:13px;background:var(--event);transform:rotate(45deg);border-radius:3px;box-shadow:0 0 0 4px #ede9fe}.notice-text{min-width:0;flex:1}.notice-text strong{display:block;font-size:13px}.notice-text span{display:block;font-size:11px;color:var(--muted);margin-top:2px}.chev{font-size:20px;color:#8b5cf6}
.timeline-card{display:flex;flex-direction:column;min-height:0;flex:1}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.section-head h3{margin:0;font-size:14px}.section-head span{font-size:10px;color:var(--muted)}.timeline-visual{position:relative;flex:1;min-height:220px;border-radius:15px;background:linear-gradient(#fafafa,#fff);border:1px solid var(--line);overflow:hidden;padding:24px 8px 10px}.axis{position:absolute;left:14px;right:14px;top:48%;height:2px;background:#d9dee5}.axis-labels{position:absolute;left:12px;right:12px;top:calc(48% + 7px);display:flex;justify-content:space-between;color:#9ca3af;font-size:9px}.event-dot{position:absolute;width:15px;height:15px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.12);transform:translate(-50%,-50%)}.event-dot.meal{background:#d97706}.event-dot.sleep{background:#2563eb}.event-dot.body{background:#dc2626}.event-dot.energy{background:#7c3aed}.event-dot.move{background:#16a34a}.event-dot.dev{border-radius:4px;transform:translate(-50%,-50%) rotate(45deg);background:var(--event);box-shadow:0 0 0 4px #ede9fe}.event-label{position:absolute;transform:translateX(-50%);font-size:10px;font-weight:800;white-space:nowrap}.event-label.sub{font-weight:700;color:var(--muted);font-size:9px}.legend{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:6px;color:var(--muted);font-size:9px}.legend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:3px}
.flow-card{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:18px}.flow-row{display:grid;grid-template-columns:62px 1fr;gap:9px;align-items:center}.flow-label{font-size:12px;font-weight:900}.flow-track{height:28px;background:#eef1f5;border-radius:999px;position:relative;overflow:hidden}.usual{position:absolute;left:20%;right:20%;top:7px;height:14px;background:#d4d9e0;border-radius:99px;transition:.3s}.flow-line{position:absolute;left:8%;top:13px;height:2px;background:#111827;transform-origin:left;transition:.3s}.mark{position:absolute;top:8px;width:10px;height:10px;background:var(--event);transform:rotate(45deg);border-radius:2px;transition:.3s}.flow-note{font-size:12px;line-height:1.45;color:var(--muted);text-align:center}.baseline-note{font-size:12px;line-height:1.45;background:#f8fafc;border-radius:14px;padding:10px;color:#475569;text-align:center}
.fab{position:fixed;right:max(18px,calc((100vw - 480px)/2 + 18px));bottom:calc(16px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:50%;border:0;background:#111827;color:#fff;font-size:26px;box-shadow:0 10px 28px rgba(17,24,39,.25);z-index:40}.sheet-wrap{position:fixed;inset:0;background:rgba(15,23,42,.28);display:none;align-items:flex-end;z-index:100}.sheet-wrap.show{display:flex}.sheet{width:100%;max-width:480px;margin:0 auto;background:#fff;border-radius:24px 24px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom))}.handle{width:42px;height:5px;border-radius:99px;background:#d1d5db;margin:2px auto 14px}.quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.quick{border:0;background:#f3f4f6;border-radius:15px;padding:12px 6px;font-weight:800;min-height:64px}.quick span{display:block;font-size:21px}.detail-card{font-size:13px;line-height:1.5;color:#374151;background:#f8fafc;border-radius:14px;padding:12px}.flash{position:fixed;inset:0;pointer-events:none;z-index:200;display:none;align-items:center;justify-content:center;background:radial-gradient(circle at center,#ede9fe 0,#ddd6fe 36%,rgba(124,58,237,.92) 100%);color:#fff;text-align:center;padding:24px}.flash.show{display:flex;animation:flashout 2.3s forwards}.flash strong{display:block;font-size:44px;margin:6px 0}.flash small{letter-spacing:.18em;font-weight:900}@keyframes flashout{0%,68%{opacity:1}100%{opacity:0;visibility:hidden}}@media(max-height:720px){.summary{grid-template-columns:repeat(2,1fr)}.timeline-visual{min-height:165px}.card{padding:9px}.days .day{padding:6px 2px}}
</style>
</head><body>
<div class="app">
<header class="header"><div class="brand"><small>MYFIT</small><h1>Today</h1><div class="tagline">Life that fits me.</div></div><button class="ghost" id="demoBtn">Play change</button></header>
<div class="days" id="days"></div>
<div class="tabs"><button class="tab active" data-tab="today">Today</button><button class="tab" data-tab="flow">Flow</button></div>
<section class="panel active" id="todayPanel">
<div class="summary" id="summary"></div>
<button class="card notice hidden" id="noticeBtn"><span class="diamond"></span><span class="notice-text"><strong id="noticeTitle"></strong><span id="noticeSub"></span></span><span class="chev">›</span></button>
<section class="card timeline-card"><div class="section-head"><h3>Today at a glance</h3><span>06:00 → 22:00</span></div><div class="timeline-visual" id="timeline"><div class="axis"></div><div class="axis-labels"><span>06</span><span>10</span><span>14</span><span>18</span><span>22</span></div></div><div class="legend"><span><i style="background:#2563eb"></i>Sleep</span><span><i style="background:#d97706"></i>Meal</span><span><i style="background:#16a34a"></i>Move</span><span>◆ different</span></div></section>
</section>
<section class="panel" id="flowPanel"><section class="card flow-card"><div class="section-head"><h3>Flow</h3><span id="flowRange"></span></div><div id="flowRows"></div><div class="baseline-note" id="baselineNote"></div><div class="flow-note">The band is the recent usual zone. It can move when repeated change becomes the new usual.</div></section></section>
</div>
<button class="fab" id="addBtn">＋</button>
<div class="sheet-wrap" id="sheetWrap"><div class="sheet"><div class="handle"></div><h3>Add to Today</h3><div class="quick-grid"><button class="quick"><span>⚖️</span>Weight</button><button class="quick"><span>🩸</span>BP</button><button class="quick"><span>🍽️</span>Meal</button><button class="quick"><span>😴</span>Sleep</button><button class="quick"><span>⚡</span>Energy</button><button class="quick"><span>🏃</span>Movement</button></div></div></div>
<div class="sheet-wrap" id="noticeSheet"><div class="sheet"><div class="handle"></div><h3 id="detailTitle"></h3><div class="detail-card" id="detailText"></div></div></div>
<div class="flash" id="flash"><div><small>DIFFERENT TODAY</small><strong id="flashMain"></strong><p id="flashSub"></p></div></div>
<script>
const days=[
{sleep:'6h 31m',energy:'3 / 5',move:'Usual',meals:'3',notice:null,squat:5,events:[['sleep',6.7,'Wake','06:42'],['meal',7.2,'Breakfast','07:18'],['body',7.6,'82.2kg','07:35'],['meal',12.5,'Lunch','12:31'],['move',18.1,'Squat 5','18:08'],['meal',19.3,'Dinner','19:20']],baseline:'Learning your usual range.',flow:[0,0,0,0]},
{sleep:'6h 38m',energy:'3 / 5',move:'Usual',meals:'3',notice:null,squat:6,events:[['sleep',6.8,'Wake','06:49'],['meal',7.3,'Breakfast','07:22'],['body',7.6,'82.1kg','07:38'],['meal',12.6,'Lunch','12:34'],['move',18.2,'Squat 6','18:13'],['meal',19.4,'Dinner','19:27']],baseline:'A stable pattern is beginning to form.',flow:[1,1,0,0]},
{sleep:'6h 29m',energy:'3 / 5',move:'Usual',meals:'3',notice:null,squat:5,events:[['sleep',6.6,'Wake','06:36'],['meal',7.1,'Breakfast','07:11'],['body',7.5,'82.2kg','07:31'],['meal',12.4,'Lunch','12:25'],['move',18.0,'Squat 5','18:02'],['meal',19.2,'Dinner','19:15']],baseline:'Recent usual: Squat about 5–6 reps.',flow:[0,0,0,0]},
{sleep:'6h 34m',energy:'3 / 5',move:'Different',meals:'3',notice:{title:'Something is different',sub:'Squat moved outside your recent usual range',detail:'Recent Squat values clustered around 5–6 reps. Today was 10 reps. MyFit is only showing the difference.',flash:'10 reps',flashSub:'Recent usual: 5–6'},squat:10,events:[['sleep',6.7,'Wake','06:42'],['meal',7.2,'Breakfast','07:18'],['body',7.6,'82.1kg','07:35'],['meal',12.5,'Lunch','12:31'],['dev',18.2,'Squat 10','18:12 ◆'],['meal',19.4,'Dinner','19:26']],baseline:'One large change appears. It is not a new habit yet.',flow:[0,0,3,0]},
{sleep:'6h 36m',energy:'3 / 5',move:'Different',meals:'3',notice:{title:'The change repeated',sub:'Squat was again above the previous usual range',detail:'This is the second repeated higher-rep session. MyFit still treats it as a change, not yet as the new usual.',flash:'10 reps',flashSub:'Repeated change'},squat:10,events:[['sleep',6.8,'Wake','06:47'],['meal',7.2,'Breakfast','07:20'],['body',7.5,'82.0kg','07:32'],['meal',12.6,'Lunch','12:35'],['dev',18.1,'Squat 10','18:09 ◆'],['meal',19.3,'Dinner','19:21']],baseline:'Repeated change is being watched, not judged.',flow:[0,0,5,0]},
{sleep:'6h 40m',energy:'3 / 5',move:'Shifting',meals:'3',notice:{title:'Your usual may be shifting',sub:'Higher Squat reps have repeated several times',detail:'The old 5–6 rep cluster no longer describes recent sessions well. MyFit is beginning to move the usual zone.',flash:'Usual shifting',flashSub:'5–6 → around 10'},squat:10,events:[['sleep',6.8,'Wake','06:50'],['meal',7.3,'Breakfast','07:24'],['body',7.5,'82.0kg','07:34'],['meal',12.6,'Lunch','12:33'],['dev',18.2,'Squat 10','18:14 ◆'],['meal',19.4,'Dinner','19:25']],baseline:'The baseline itself is beginning to move.',flow:[1,1,7,0]},
{sleep:'6h 37m',energy:'3 / 5',move:'New usual',meals:'3',notice:{title:'A new usual is forming',sub:'10 reps now fits your recent pattern',detail:'MyFit no longer needs to flag 10 reps as unusual every time. What was once a deviation has become part of your recent baseline.',flash:'New usual',flashSub:'Around 10 reps'},squat:10,events:[['sleep',6.8,'Wake','06:48'],['meal',7.2,'Breakfast','07:19'],['body',7.5,'81.9kg','07:33'],['meal',12.5,'Lunch','12:30'],['move',18.2,'Squat 10','18:11'],['meal',19.3,'Dinner','19:22']],baseline:'What was different has become part of the recent usual.',flow:[0,0,9,0]}
];
let current=0;const dayNames=['1','2','3','4','5','6','7'];
function pct(hour){return Math.max(4,Math.min(96,((hour-6)/16)*100))}
function renderDays(){daysEl.innerHTML=dayNames.map((d,i)=>`<button class="day ${i===current?'active':''}" data-day="${i}">D${d}</button>`).join('');document.querySelectorAll('.day').forEach(b=>b.onclick=()=>{current=+b.dataset.day;render()})}
function metric(label,value,pos){return `<div class="metric"><small>${label}</small><strong>${value}</strong><div class="band"><span class="usualband"></span><span class="dot" style="left:${pos}%"></span></div></div>`}
function render(){renderDays();const d=days[current];summary.innerHTML=metric('Sleep',d.sleep,55)+metric('Energy',d.energy,49)+metric('Move',d.move,d.squat>=10?72:55)+metric('Meals',d.meals,60);noticeBtn.classList.toggle('hidden',!d.notice);if(d.notice){noticeTitle.textContent=d.notice.title;noticeSub.textContent=d.notice.sub;detailTitle.textContent='◆ '+d.notice.title;detailText.textContent=d.notice.detail}timeline.querySelectorAll('.dyn').forEach(x=>x.remove());d.events.forEach((e,idx)=>{const [type,h,label,time]=e;const x=pct(h),upper=idx%2===0;const dot=document.createElement('span');dot.className=`event-dot dyn ${type==='dev'?'dev':type}`;dot.style.left=x+'%';dot.style.top='48%';timeline.appendChild(dot);const a=document.createElement('span');a.className='event-label dyn';a.style.left=x+'%';a.style.top=upper?'18%':'67%';a.textContent=label;timeline.appendChild(a);const s=document.createElement('span');s.className='event-label sub dyn';s.style.left=x+'%';s.style.top=upper?'30%':'78%';s.textContent=time;timeline.appendChild(s)});renderFlow(d);}
function renderFlow(d){flowRange.textContent=`Day 1 → Day ${current+1}`;const labels=['Sleep','Meals','Workout','Energy'];flowRows.innerHTML=labels.map((l,i)=>{let shift=d.flow[i];let left=20,right=20;let width=70,mark='';if(i===2&&current>=5){left=45;right=7}if(shift>0)mark=`<span class="mark" style="right:${Math.max(6,20-shift)}%"></span>`;return `<div class="flow-row"><div class="flow-label">${l}</div><div class="flow-track"><span class="usual" style="left:${left}%;right:${right}%"></span><span class="flow-line" style="width:${width}%"></span>${mark}</div></div>`}).join('');baselineNote.textContent=d.baseline}
const daysEl=document.getElementById('days');const tabs=document.querySelectorAll('.tab');tabs.forEach(t=>t.onclick=()=>{tabs.forEach(x=>x.classList.remove('active'));t.classList.add('active');document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));document.getElementById(t.dataset.tab+'Panel').classList.add('active')});
const sheet=document.getElementById('sheetWrap'),noticeSheet=document.getElementById('noticeSheet');addBtn.onclick=()=>sheet.classList.add('show');noticeBtn.onclick=()=>noticeSheet.classList.add('show');[sheet,noticeSheet].forEach(s=>s.onclick=e=>{if(e.target===s)s.classList.remove('show')});demoBtn.onclick=()=>{const n=days[current].notice;if(!n)return;flashMain.textContent=n.flash;flashSub.textContent=n.flashSub;flash.classList.remove('show');void flash.offsetWidth;flash.classList.add('show');setTimeout(()=>flash.classList.remove('show'),2400)};render();
</script></body></html>
