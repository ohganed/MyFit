<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MyFit Today v0.4</title>
<style>
:root{--bg:#f4f6f8;--ink:#111827;--muted:#6b7280;--line:#d7dde5;--blue:#1677ee;--orange:#e97800;--green:#10a354;--purple:#7650d6}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;color:var(--ink)}button{font:inherit}.app{height:100dvh;max-width:480px;margin:auto;padding:calc(10px + env(safe-area-inset-top)) 12px calc(70px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}.head{display:flex;align-items:center;justify-content:space-between}.eyebrow{font-size:10px;letter-spacing:.14em;color:var(--muted);font-weight:900}.head h1{font-size:28px;margin:2px 0 0}.tag{font-size:12px;color:var(--muted)}.play{border:0;background:#fff;color:#0784ff;font-weight:900;border-radius:999px;padding:9px 13px;box-shadow:0 3px 14px #1111}.days{display:grid;grid-template-columns:repeat(7,1fr);padding:3px;background:#e9edf2;border-radius:14px}.day{border:0;background:transparent;padding:7px 2px;border-radius:11px;font-weight:900;color:#69717d}.day.active{background:#fff;color:var(--ink);box-shadow:0 1px 5px #1111}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.metric{background:#fff;border:1px solid #e1e5ea;border-radius:15px;padding:9px 7px;min-width:0}.metric small{display:block;color:var(--muted);font-weight:800;font-size:10px}.metric strong{font-size:15px;display:block;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mini{height:4px;background:#eef1f4;border-radius:9px;margin-top:7px;position:relative}.mini:after{content:"";position:absolute;width:7px;height:7px;background:#172033;border-radius:50%;left:58%;top:50%;transform:translate(-50%,-50%)}.card{background:#fff;border-radius:20px;box-shadow:0 2px 12px #1111}.timeline-card{flex:1;min-height:0;padding:12px;display:flex;flex-direction:column}.section{display:flex;justify-content:space-between;align-items:center}.section h2{font-size:14px;margin:0}.section span{font-size:10px;color:var(--muted)}.timeline{position:relative;flex:1;min-height:280px;margin-top:5px;overflow:hidden}.axis{position:absolute;left:4%;right:4%;top:21%;height:2px;background:var(--line)}.ticks{position:absolute;left:4%;right:4%;top:calc(21% - 19px);display:flex;justify-content:space-between;color:#8b95a3;font-size:9px}.event{position:absolute;top:21%;left:var(--x);width:0;height:0}.node{position:absolute;width:14px;height:14px;border:3px solid white;border-radius:50%;box-shadow:0 1px 5px #0002;transform:translate(-50%,-50%);background:var(--c)}.stem{position:absolute;top:7px;left:-1px;width:1px;height:var(--stem);border-left:1px dashed #d6dce4}.label{position:absolute;top:var(--y);left:var(--shift);transform:translateX(-50%);white-space:nowrap;border:0;background:transparent;padding:0;text-align:left;color:var(--ink);font-weight:900;font-size:11px}.label .time{display:block;color:var(--c);font-size:9px;margin-bottom:3px}.label .pill{display:block;padding:7px 9px;border-radius:10px;background:var(--bgc);box-shadow:0 1px 4px #1111}.label.dev .pill:after{content:'◆';color:#596273;margin-left:7px}.legend{display:flex;justify-content:center;gap:10px;color:var(--muted);font-size:9px;padding-top:5px;border-top:1px solid #eef0f3}.legend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:3px}.fab{position:fixed;right:max(18px,calc((100vw - 480px)/2 + 18px));bottom:calc(15px + env(safe-area-inset-bottom));width:54px;height:54px;border:0;border-radius:50%;background:#101a2d;color:#fff;font-size:27px;box-shadow:0 10px 25px #1114}.sheetwrap{position:fixed;inset:0;background:#0f172a44;display:none;align-items:flex-end;z-index:20}.sheetwrap.show{display:flex}.sheet{width:100%;max-width:480px;margin:auto;background:#fff;border-radius:24px 24px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom))}.handle{width:42px;height:5px;background:#d3d8df;border-radius:9px;margin:2px auto 14px}.detail{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.detail div{background:#f5f7f9;border-radius:12px;padding:10px;font-size:11px;color:var(--muted)}.detail strong{display:block;color:var(--ink);margin-top:3px}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.quick button{border:0;background:#f3f5f7;border-radius:14px;padding:12px 4px;font-weight:800}.flash{position:fixed;inset:0;background:radial-gradient(circle,#e9e4ff,#7650d6);z-index:50;display:none;place-items:center;color:#fff;text-align:center}.flash.show{display:grid;animation:gone 2.2s forwards}.flash strong{font-size:42px;display:block}@keyframes gone{0%,70%{opacity:1}100%{opacity:0;visibility:hidden}}@media(max-height:700px){.app{gap:5px}.head h1{font-size:23px}.tag{display:none}.summary .metric{padding:6px}.timeline{min-height:230px}}
</style></head><body><main class="app"><header class="head"><div><div class="eyebrow">MYFIT</div><h1>Today</h1><div class="tag">Life that fits me.</div></div><button class="play" id="play">▶ Play change</button></header><div class="days"><button class="day active">D1</button><button class="day">D2</button><button class="day">D3</button><button class="day">D4</button><button class="day">D5</button><button class="day">D6</button><button class="day">D7</button></div><section class="summary"><div class="metric"><small>Sleep</small><strong>6h 31m</strong><div class="mini"></div></div><div class="metric"><small>Energy</small><strong>3 / 5</strong><div class="mini"></div></div><div class="metric"><small>Move</small><strong>Usual</strong><div class="mini"></div></div><div class="metric"><small>Meals</small><strong>3</strong><div class="mini"></div></div></section><section class="card timeline-card"><div class="section"><h2>Today timeline</h2><span>06:00 → 22:00</span></div><div class="timeline" id="timeline"><div class="axis"></div><div class="ticks"><span>06</span><span>10</span><span>14</span><span>18</span><span>22</span></div></div><div class="legend"><span><i style="background:var(--blue)"></i>Sleep</span><span><i style="background:var(--orange)"></i>Meal</span><span><i style="background:var(--green)"></i>Move</span><span>◆ Different</span></div></section></main><button class="fab" id="add">＋</button><div class="sheetwrap" id="detailWrap"><div class="sheet"><div class="handle"></div><h3 id="detailTitle">Event</h3><div class="detail" id="detail"></div></div></div><div class="sheetwrap" id="addWrap"><div class="sheet"><div class="handle"></div><h3>Add to Today</h3><div class="quick"><button>⚖️<br>Weight</button><button>🍽️<br>Meal</button><button>🏃<br>Move</button><button>😴<br>Sleep</button><button>⚡<br>Energy</button><button>📝<br>Note</button></div></div></div><div class="flash" id="flash"><div><small>DIFFERENT TODAY</small><strong>Squat 10</strong><p>Recent usual: 5–6</p></div></div>
<script>
const events=[
{t:6.67,name:'Wake up',kind:'sleep',color:'#1677ee',bg:'#eef6ff',lane:0,shift:34,detail:['06:40','Wake up','Recorded']},
{t:7.30,name:'Breakfast',kind:'meal',color:'#e97800',bg:'#fff5e9',lane:1,shift:48,detail:['07:18','Breakfast','Usual pattern']},
{t:7.83,name:'Walking',kind:'move',color:'#10a354',bg:'#eefaf3',lane:2,shift:62,detail:['07:50','32 min','2.6 km']},
{t:12.52,name:'Lunch',kind:'meal',color:'#e97800',bg:'#fff5e9',lane:1,shift:8,detail:['12:31','Lunch','Recorded']},
{t:18.13,name:'Squat 5 sets',kind:'move',color:'#10a354',bg:'#eefaf3',lane:0,shift:0,dev:true,detail:['18:08','5 × 5 reps','RPE 7']},
{t:19.33,name:'Dinner',kind:'meal',color:'#e97800',bg:'#fff5e9',lane:2,shift:8,detail:['19:20','Dinner','Recorded']}
];
const tl=document.getElementById('timeline');function x(t){return 4+((t-6)/16)*92}events.forEach((e,i)=>{const wrap=document.createElement('div');wrap.className='event';wrap.style.setProperty('--x',x(e.t)+'%');wrap.style.setProperty('--c',e.color);const laneY=[42,88,134][e.lane];wrap.innerHTML=`<span class="node"></span><span class="stem" style="--stem:${laneY-4}px"></span><button class="label ${e.dev?'dev':''}" style="--y:${laneY}px;--shift:${e.shift}px;--c:${e.color};--bgc:${e.bg}"><span class="time">${e.detail[0]}</span><span class="pill">${e.name}</span></button>`;wrap.querySelector('.label').onclick=()=>openDetail(e);wrap.querySelector('.node').onclick=()=>openDetail(e);tl.appendChild(wrap)});
function openDetail(e){document.getElementById('detailTitle').textContent=e.name;document.getElementById('detail').innerHTML=e.detail.map((v,i)=>`<div>${['Time','Detail','Context'][i]}<strong>${v}</strong></div>`).join('');document.getElementById('detailWrap').classList.add('show')};document.getElementById('detailWrap').onclick=e=>{if(e.target.id==='detailWrap')e.currentTarget.classList.remove('show')};document.getElementById('add').onclick=()=>document.getElementById('addWrap').classList.add('show');document.getElementById('addWrap').onclick=e=>{if(e.target.id==='addWrap')e.currentTarget.classList.remove('show')};document.getElementById('play').onclick=()=>{const f=document.getElementById('flash');f.classList.remove('show');void f.offsetWidth;f.classList.add('show')};
</script></body></html>
