<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MyFit Today v0.6</title><style>:root{--bg:#f4f6f8;--ink:#111827;--muted:#6b7280;--line:#d7dde5;--blue:#1677ee;--orange:#e97800;--green:#10a354;--purple:#7650d6}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;color:var(--ink)}button{font:inherit}.app{height:100dvh;max-width:480px;margin:auto;padding:calc(10px + env(safe-area-inset-top)) 12px calc(70px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}.head{display:flex;align-items:center;justify-content:space-between}.eyebrow{font-size:10px;letter-spacing:.14em;color:var(--muted);font-weight:900}.head h1{font-size:28px;margin:2px 0}.tag{font-size:12px;color:var(--muted)}.play{border:0;background:#fff;color:#0784ff;font-weight:900;border-radius:999px;padding:9px 13px;box-shadow:0 3px 14px #1111}.days{display:grid;grid-template-columns:repeat(7,1fr);padding:3px;background:#e9edf2;border-radius:14px}.day{border:0;background:transparent;padding:7px 2px;border-radius:11px;font-weight:900;color:#69717d}.day.active{background:#fff;color:var(--ink);box-shadow:0 1px 5px #1111}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.metric{background:#fff;border:1px solid #e1e5ea;border-radius:15px;padding:9px 7px;min-width:0}.metric small{display:block;color:var(--muted);font-weight:800;font-size:10px}.metric strong{font-size:15px;display:block;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mini{height:4px;background:#eef1f4;border-radius:9px;margin-top:7px;position:relative}.mini .band{position:absolute;height:4px;left:25%;right:20%;background:#ccd3dc;border-radius:9px}.mini .dot{position:absolute;width:7px;height:7px;background:#172033;border-radius:50%;top:50%;transform:translate(-50%,-50%)}.card{background:#fff;border-radius:20px;box-shadow:0 2px 12px #1111}.timeline-card{flex:1;min-height:0;padding:12px;display:flex;flex-direction:column}.section{display:flex;justify-content:space-between;align-items:center}.section h2{font-size:14px;margin:0}.section span{font-size:10px;color:var(--muted)}.timeline{position:relative;flex:1;min-height:280px;margin-top:5px;overflow:hidden}.axis{position:absolute;left:4%;right:4%;top:21%;height:2px;background:var(--line)}.ticks{position:absolute;left:4%;right:4%;top:calc(21% - 19px);display:flex;justify-content:space-between;color:#8b95a3;font-size:9px}.timeband{position:absolute;top:calc(21% - 5px);height:10px;border-radius:99px;opacity:.23}.timeband.breakfast{background:var(--orange)}.event{position:absolute;top:21%;left:var(--x);width:0;height:0}.node{position:absolute;width:14px;height:14px;border:3px solid white;border-radius:50%;box-shadow:0 1px 5px #0002;transform:translate(-50%,-50%);background:var(--c)}.node.dev{border-radius:4px;transform:translate(-50%,-50%) rotate(45deg);box-shadow:0 0 0 4px #ede9fe}.stem{position:absolute;top:7px;left:-1px;width:1px;height:var(--stem);border-left:1px dashed #d6dce4}.label{position:absolute;top:var(--y);left:var(--shift);transform:translateX(-50%);white-space:nowrap;border:0;background:transparent;padding:0;text-align:left;color:var(--ink);font-weight:900;font-size:11px}.label .time{display:block;color:var(--c);font-size:9px;margin-bottom:3px}.pill{display:block;padding:7px 9px;border-radius:10px;background:var(--bgc);box-shadow:0 1px 4px #1111}.label.dev .pill:after{content:'◆';color:#7650d6;margin-left:7px}.legend{display:flex;justify-content:center;gap:10px;color:var(--muted);font-size:9px;padding-top:5px;border-top:1px solid #eef0f3}.legend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:3px}.hint{height:30px;text-align:center;font-size:11px;color:var(--muted);padding-top:7px}.hint strong{color:var(--purple)}.fab{position:fixed;right:max(18px,calc((100vw - 480px)/2 + 18px));bottom:calc(15px + env(safe-area-inset-bottom));width:54px;height:54px;border:0;border-radius:50%;background:#101a2d;color:#fff;font-size:27px;box-shadow:0 10px 25px #1114}.sheetwrap{position:fixed;inset:0;background:#0f172a44;display:none;align-items:flex-end;z-index:20}.sheetwrap.show{display:flex}.sheet{width:100%;max-width:480px;margin:auto;background:#fff;border-radius:24px 24px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom))}.handle{width:42px;height:5px;background:#d3d8df;border-radius:9px;margin:2px auto 14px}.detail{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.detail div{background:#f5f7f9;border-radius:12px;padding:10px;font-size:11px;color:var(--muted)}.detail strong{display:block;color:var(--ink);margin-top:3px}.reflection{margin-top:10px;background:#faf8ff;border-radius:13px;padding:11px;font-size:12px;color:#5c526d}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.quick button{border:0;background:#f3f5f7;border-radius:14px;padding:12px 4px;font-weight:800}.flash{position:fixed;inset:0;background:radial-gradient(circle,#e9e4ff,#7650d6);z-index:50;display:none;place-items:center;color:#fff;text-align:center}.flash.show{display:grid;animation:gone 2.2s forwards}.flash strong{font-size:42px;display:block}@keyframes gone{0%,70%{opacity:1}100%{opacity:0;visibility:hidden}}@media(max-height:700px){.app{gap:5px}.head h1{font-size:23px}.tag{display:none}.summary .metric{padding:6px}.timeline{min-height:230px}}</style></head><body><main class="app"><header class="head"><div><div class="eyebrow">MYFIT</div><h1>Today</h1><div class="tag">Life that fits me.</div></div><button class="play" id="play">▶ Play change</button></header><div class="days" id="days"></div><section class="summary" id="summary"></section><section class="card timeline-card"><div class="section"><h2>Today timeline</h2><span>06:00 → 22:00</span></div><div class="timeline" id="timeline"><div class="axis"></div><div class="ticks"><span>06</span><span>10</span><span>14</span><span>18</span><span>22</span></div></div><div class="hint" id="hint"></div><div class="legend"><span><i style="background:var(--blue)"></i>Sleep</span><span><i style="background:var(--orange)"></i>Meal</span><span><i style="background:var(--green)"></i>Move</span><span>◆ Different</span></div></section></main><button class="fab" id="add">＋</button><div class="sheetwrap" id="detailWrap"><div class="sheet"><div class="handle"></div><h3 id="detailTitle">Event</h3><div class="detail" id="detail"></div><div class="reflection" id="reflection"></div></div></div><div class="sheetwrap" id="addWrap"><div class="sheet"><div class="handle"></div><h3>Add to Today</h3><div class="quick"><button>⚖️<br>Weight</button><button>🍽️<br>Meal</button><button>🏃<br>Move</button><button>😴<br>Sleep</button><button>⚡<br>Energy</button><button>📝<br>Note</button></div></div></div><div class="flash" id="flash"><div><small id="flashTop">DIFFERENT TODAY</small><strong id="flashMain">Breakfast</strong><p id="flashSub">A different morning pattern</p></div></div><script>
const core=[['sleep','Wake up',0,34],['meal','Breakfast',1,48],['move','Walking',2,62],['meal','Lunch',1,8],['move','Squat',0,0],['meal','Dinner',2,8]];
const days=[

{sleep:'6h 38m',energy:'3 / 5',move:'Usual',meals:'3',wake:6.78,breakfast:7.37,walk:7.95,lunch:12.56,squat:18.22,dinner:19.40,reps:6,breakfastPattern:'Rice · natto · miso soup',breakfastDev:false,hint:'Small meal differences stay inside the usual pattern.'},

{sleep:'6h 34m',energy:'3 / 5',move:'Different',meals:'3',wake:6.70,breakfast:9.17,walk:9.72,lunch:13.10,squat:18.20,dinner:19.43,reps:10,breakfastPattern:'Croissant · yogurt · fruit · coffee',breakfastDev:true,hint:'Breakfast was outside both your usual time zone and usual pattern.'},
{sleep:'6h 36m',energy:'3 / 5',move:'Different',meals:'3',wake:6.75,breakfast:7.42,walk:7.98,lunch:12.58,squat:18.15,dinner:19.35,reps:10,breakfastPattern:'Rice · egg · miso soup',breakfastDev:false,hint:'Today is close to your recent breakfast pattern again.'},
{sleep:'6h 40m',energy:'3 / 5',move:'Shifting',meals:'3',wake:6.82,breakfast:8.62,walk:9.12,lunch:12.70,squat:18.23,dinner:19.42,reps:10,breakfastPattern:'Bread · yogurt · fruit',breakfastDev:true,hint:'A later, different breakfast pattern has repeated.'},
{sleep:'6h 37m',energy:'3 / 5',move:'New usual',meals:'3',wake:6.80,breakfast:8.45,walk:9.02,lunch:12.62,squat:18.18,dinner:19.38,reps:10,breakfastPattern:'Bread · yogurt · fruit',breakfastDev:false,newBreakfastUsual:true,hint:'Your morning pattern may be changing.'}
];
let current=0;const colors={sleep:'#1677ee',meal:'#e97800',move:'#10a354'},bgs={sleep:'#eef6ff',meal:'#fff5e9',move:'#eefaf3'};function xpos(t){return 4+((t-6)/16)*92}function fmt(t){let h=Math.floor(t),m=Math.round((t-h)*60);if(m===60){h++;m=0}return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')}function render(){const d=days[current];document.getElementById('days').innerHTML=days.map((_,i)=>`<button class="day ${i===current?'active':''}" data-i="${i}">D${i+1}</button>`).join('');document.querySelectorAll('.day').forEach(b=>b.onclick=()=>{current=+b.dataset.i;render()});document.getElementById('summary').innerHTML=[['Sleep',d.sleep,55],['Energy',d.energy,50],['Move',d.move,d.reps===10?78:45],['Meals',d.meals,d.breakfastDev?75:52]].map(x=>`<div class="metric"><small>${x[0]}</small><strong>${x[1]}</strong><div class="mini"><span class="band"></span><span class="dot" style="left:${x[2]}%"></span></div></div>`).join('');const tl=document.getElementById('timeline');tl.querySelectorAll('.event,.timeband').forEach(e=>e.remove());const tb=document.createElement('div');tb.className='timeband breakfast';tb.style.left=xpos(7.0)+'%';tb.style.width=(xpos(7.75)-xpos(7.0))+'%';tl.appendChild(tb);const vals=[d.wake,d.breakfast,d.walk,d.lunch,d.squat,d.dinner];core.forEach((a,i)=>{let[k,name,lane,shift]=a;const t=vals[i];const isBreakfast=name==='Breakfast',isSquat=name==='Squat';const dev=isBreakfast&&d.breakfastDev;const color=dev?'#7650d6':colors[k],bg=dev?'#f4f0ff':bgs[k];let detail=[fmt(t),name,'Recorded'];if(isBreakfast){detail=[fmt(t),d.breakfastPattern,d.newBreakfastUsual?'New recent morning pattern':dev?'Outside recent morning pattern':'Inside recent morning pattern'];}if(isSquat){detail=[fmt(t),`${d.reps} reps`,d.reps===10?'Higher-rep pattern':'Recent usual'];}const e={name:isSquat?`Squat ${d.reps}`:name,color,bg,detail,dev};const w=document.createElement('div');w.className='event';w.style.setProperty('--x',xpos(t)+'%');w.style.setProperty('--c',color);const y=[42,88,134][lane];w.innerHTML=`<span class="node ${dev?'dev':''}"></span><span class="stem" style="--stem:${y-4}px"></span><button class="label ${dev?'dev':''}" style="--y:${y}px;--shift:${shift}px;--c:${color};--bgc:${bg}"><span class="time">${fmt(t)}</span><span class="pill">${e.name}</span></button>`;w.querySelectorAll('.node,.label').forEach(el=>el.onclick=()=>openDetail(e));tl.appendChild(w)});document.getElementById('hint').innerHTML=d.breakfastDev?`<strong>◆</strong> ${d.hint}`:d.hint}function openDetail(e){document.getElementById('detailTitle').textContent=e.name;document.getElementById('detail').innerHTML=e.detail.map((v,i)=>`<div>${['Time','Detail','Context'][i]}<strong>${v}</strong></div>`).join('');document.getElementById('reflection').textContent=e.dev?'MyFit noticed a meaningful difference in timing and pattern. It is not judging the choice.':e.detail[2];document.getElementById('detailWrap').classList.add('show')}document.getElementById('detailWrap').onclick=e=>{if(e.target.id==='detailWrap')e.currentTarget.classList.remove('show')};document.getElementById('add').onclick=()=>document.getElementById('addWrap').classList.add('show');document.getElementById('addWrap').onclick=e=>{if(e.target.id==='addWrap')e.currentTarget.classList.remove('show')};document.getElementById('play').onclick=()=>{current=3;render();document.getElementById('flashMain').textContent='Breakfast';document.getElementById('flashSub').textContent='Outside your recent morning pattern';const f=document.getElementById('flash');f.classList.remove('show');void f.offsetWidth;f.classList.add('show')};render();</script></body></html>
