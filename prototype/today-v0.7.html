<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MyFit Today v0.7</title><style>:root{--bg:#f4f6f8;--card:#fff;--ink:#111827;--muted:#7b8491;--line:#d5dbe3;--blue:#1677ee;--orange:#e97800;--green:#10a354;--purple:#7650d6}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;color:var(--ink)}button{font:inherit}.app{height:100dvh;max-width:480px;margin:auto;padding:calc(10px + env(safe-area-inset-top)) 12px calc(72px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}.head{display:flex;justify-content:space-between;align-items:flex-start}.eyebrow{font-size:10px;letter-spacing:.14em;color:var(--muted);font-weight:900}.head h1{font-size:28px;margin:2px 0}.tag{font-size:12px;color:var(--muted)}.actions{display:flex;gap:6px}.ghost{border:0;background:#fff;border-radius:999px;padding:8px 11px;font-weight:850;color:#374151;box-shadow:0 2px 10px #1111}.days{display:grid;grid-template-columns:repeat(7,1fr);padding:3px;background:#e8ecf1;border-radius:14px}.day{border:0;background:transparent;padding:7px 2px;border-radius:11px;font-weight:900;color:#69717d}.day.active{background:#fff;color:var(--ink);box-shadow:0 1px 5px #1111}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.metric{background:#fff;border:1px solid #e1e5ea;border-radius:15px;padding:8px 7px}.metric small{display:block;color:var(--muted);font-size:10px;font-weight:800}.metric strong{display:block;font-size:15px;margin-top:3px}.mini{height:4px;background:#eef1f4;border-radius:9px;margin-top:7px;position:relative}.mini .band{position:absolute;left:25%;right:20%;height:4px;background:#ccd3dc;border-radius:9px}.mini .dot{position:absolute;width:7px;height:7px;background:#172033;border-radius:50%;top:50%;transform:translate(-50%,-50%)}.card{background:#fff;border-radius:20px;box-shadow:0 2px 12px #1111}.timeline-card{flex:1;min-height:0;padding:12px;display:flex;flex-direction:column}.section{display:flex;justify-content:space-between;align-items:center}.section h2{font-size:14px;margin:0}.section span{font-size:10px;color:var(--muted)}.timeline{position:relative;flex:1;min-height:285px;margin-top:4px;overflow:hidden}.ticks{position:absolute;left:4%;right:4%;top:23px;display:flex;justify-content:space-between;font-size:9px;color:#939ba6}.axis-base{position:absolute;left:4%;right:4%;top:48px;height:4px;background:#bfc7d1;border-radius:99px}.axis-thin{position:absolute;top:49px;height:2px;background:#d8dde4}.axis-dashed{position:absolute;top:49px;height:2px;border-top:1px dashed #b8c0ca}.usual-band{position:absolute;top:43px;height:14px;border-radius:99px;background:#e9edf2;opacity:.72}.event{position:absolute;top:50px;left:var(--x);width:0;height:0}.node{position:absolute;width:12px;height:12px;border:3px solid white;border-radius:50%;box-shadow:0 1px 4px #0002;transform:translate(-50%,-50%);background:var(--c)}.node.dev{border-radius:3px;transform:translate(-50%,-50%) rotate(45deg);background:var(--purple);box-shadow:0 0 0 4px #ede9fe}.stem{position:absolute;top:6px;left:-1px;height:var(--stem);border-left:1px dashed #d8dde4}.label{position:absolute;top:var(--y);left:var(--shift);transform:translateX(-50%);border:0;background:transparent;padding:0;white-space:nowrap;color:#5f6772;font-size:10px;font-weight:750}.label .time{display:block;font-size:8px;color:var(--muted);margin-bottom:2px}.label .name{display:block}.label.dev{color:#3f3650;font-weight:900}.label.dev .name:after{content:' ◆';color:var(--purple)}.legend{display:flex;justify-content:center;gap:10px;color:var(--muted);font-size:9px;padding-top:5px;border-top:1px solid #eef0f3}.legend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:3px}.fab{position:fixed;right:max(18px,calc((100vw - 480px)/2 + 18px));bottom:calc(15px + env(safe-area-inset-bottom));width:54px;height:54px;border:0;border-radius:50%;background:#101a2d;color:#fff;font-size:27px;box-shadow:0 10px 25px #1114}.sheetwrap{position:fixed;inset:0;background:#0f172a44;display:none;align-items:flex-end;z-index:20}.sheetwrap.show{display:flex}.sheet{width:100%;max-width:480px;margin:auto;background:#fff;border-radius:24px 24px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom))}.handle{width:42px;height:5px;background:#d3d8df;border-radius:9px;margin:2px auto 14px}.detail{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.detail div{background:#f5f7f9;border-radius:12px;padding:10px;font-size:11px;color:var(--muted)}.detail strong{display:block;color:var(--ink);margin-top:3px}.quiet{margin-top:10px;background:#fafafa;border-radius:13px;padding:10px;font-size:12px;color:#626b77}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.quick button{border:0;background:#f3f5f7;border-radius:14px;padding:12px 4px;font-weight:800}.flash{position:fixed;inset:0;background:radial-gradient(circle,#e9e4ff,#7650d6);z-index:50;display:none;place-items:center;color:#fff;text-align:center}.flash.show{display:grid;animation:gone 2.2s forwards}.flash strong{font-size:42px;display:block}@keyframes gone{0%,70%{opacity:1}100%{opacity:0;visibility:hidden}}body.gray{filter:grayscale(1)}@media(max-height:700px){.app{gap:5px}.head h1{font-size:23px}.tag{display:none}.timeline{min-height:235px}}</style></head><body><main class="app"><header class="head"><div><div class="eyebrow">MYFIT</div><h1>Today</h1><div class="tag">Life that fits me.</div></div><div class="actions"><button class="ghost" id="modeBtn">Grayscale</button><button class="ghost" id="play">◆</button></div></header><div class="days" id="days"></div><section class="summary" id="summary"></section><section class="card timeline-card"><div class="section"><h2>Today timeline</h2><span>06:00 → 22:00</span></div><div class="timeline" id="timeline"><div class="ticks"><span>06</span><span>10</span><span>14</span><span>18</span><span>22</span></div><div class="axis-base"></div><div class="axis-thin" id="workLine"></div><div class="axis-dashed" id="unknownLine"></div><div class="usual-band" id="breakfastBand"></div></div><div class="legend"><span><i style="background:var(--blue)"></i>Sleep</span><span><i style="background:var(--orange)"></i>Meal</span><span><i style="background:var(--green)"></i>Move</span><span>◆ Different</span></div></section></main><button class="fab" id="add">＋</button><div class="sheetwrap" id="detailWrap"><div class="sheet"><div class="handle"></div><h3 id="detailTitle"></h3><div class="detail" id="detail"></div><div class="quiet" id="quiet"></div></div></div><div class="sheetwrap" id="addWrap"><div class="sheet"><div class="handle"></div><h3>Add to Today</h3><div class="quick"><button>⚖️<br>Weight</button><button>🍽️<br>Meal</button><button>🏃<br>Move</button><button>😴<br>Sleep</button><button>⚡<br>Energy</button><button>📝<br>Note</button></div></div></div><div class="flash" id="flash"><div><small>DIFFERENT TODAY</small><strong>Squat 10</strong><p>Recent usual: 5–6</p></div></div><script>const colors={sleep:'#1677ee',meal:'#e97800',move:'#10a354'},days=[{sleep:'6h 31m',energy:'3 / 5',move:'Usual',meals:'3',dev:false,reps:5},{sleep:'6h 36m',energy:'3 / 5',move:'Usual',meals:'3',dev:false,reps:6},{sleep:'6h 30m',energy:'3 / 5',move:'Usual',meals:'3',dev:false,reps:5},{sleep:'6h 34m',energy:'3 / 5',move:'Different',meals:'3',dev:true,reps:10},{sleep:'6h 38m',energy:'3 / 5',move:'Different',meals:'3',dev:true,reps:10},{sleep:'6h 40m',energy:'3 / 5',move:'Shifting',meals:'3',dev:true,reps:10},{sleep:'6h 37m',energy:'3 / 5',move:'New usual',meals:'3',dev:false,reps:10}];let current=0;const base=[['sleep',6.67,'Wake up',0,28],['meal',7.30,'Breakfast',1,42],['move',7.83,'Walking',2,56],['meal',12.52,'Lunch',1,5],['move',18.13,'Squat',0,0],['meal',19.33,'Dinner',2,6]];function xp(t){return 4+((t-6)/16)*92}function render(){const d=days[current];document.getElementById('days').innerHTML=days.map((_,i)=>`<button class="day ${i===current?'active':''}" data-i="${i}">D${i+1}</button>`).join('');document.querySelectorAll('.day').forEach(b=>b.onclick=()=>{current=+b.dataset.i;render()});document.getElementById('summary').innerHTML=[['Sleep',d.sleep,56],['Energy',d.energy,50],['Move',d.move,d.reps===10?78:45],['Meals',d.meals,52]].map(x=>`<div class="metric"><small>${x[0]}</small><strong>${x[1]}</strong><div class="mini"><span class="band"></span><span class="dot" style="left:${x[2]}%"></span></div></div>`).join('');const work=document.getElementById('workLine');work.style.left=xp(9)+'%';work.style.width=(xp(15.3)-xp(9))+'%';const unknown=document.getElementById('unknownLine');unknown.style.left=xp(15.3)+'%';unknown.style.width=(xp(16.1)-xp(15.3))+'%';const bb=document.getElementById('breakfastBand');bb.style.left=xp(7.0)+'%';bb.style.width=(xp(7.75)-xp(7.0))+'%';const tl=document.getElementById('timeline');tl.querySelectorAll('.event').forEach(e=>e.remove());base.forEach(([k,t,name,lane,shift])=>{const isSquat=name==='Squat',dev=isSquat&&d.dev;const color=dev?'#7650d6':colors[k];const e={name:isSquat?`Squat ${d.reps}`:name,color,dev,detail:[`${String(Math.floor(t)).padStart(2,'0')}:${name==='Breakfast'?'18':name==='Walking'?'50':name==='Lunch'?'31':name==='Dinner'?'20':'40'}`,isSquat?`${d.reps} reps`:name,dev?'Outside recent usual':'Recorded']};const w=document.createElement('div');w.className='event';w.style.setProperty('--x',xp(t)+'%');w.style.setProperty('--c',color);const y=[42,86,130][lane];w.innerHTML=`<span class="node ${dev?'dev':''}"></span><span class="stem" style="--stem:${y-4}px"></span><button class="label ${dev?'dev':''}" style="--y:${y}px;--shift:${shift}px"><span class="time">${e.detail[0]}</span><span class="name">${e.name}</span></button>`;w.querySelectorAll('.node,.label').forEach(el=>el.onclick=()=>openDetail(e));tl.appendChild(w)})}function openDetail(e){document.getElementById('detailTitle').textContent=e.name;document.getElementById('detail').innerHTML=e.detail.map((v,i)=>`<div>${['Time','Detail','Context'][i]}<strong>${v}</strong></div>`).join('');document.getElementById('quiet').textContent=e.dev?'MyFit noticed a meaningful difference. No score. No praise. No judgment.':e.detail[2];document.getElementById('detailWrap').classList.add('show')}document.getElementById('detailWrap').onclick=e=>{if(e.target.id==='detailWrap')e.currentTarget.classList.remove('show')};document.getElementById('add').onclick=()=>document.getElementById('addWrap').classList.add('show');document.getElementById('addWrap').onclick=e=>{if(e.target.id==='addWrap')e.currentTarget.classList.remove('show')};document.getElementById('modeBtn').onclick=()=>{document.body.classList.toggle('gray');document.getElementById('modeBtn').textContent=document.body.classList.contains('gray')?'Color':'Grayscale'};document.getElementById('play').onclick=()=>{current=3;render();const f=document.getElementById('flash');f.classList.remove('show');void f.offsetWidth;f.classList.add('show')};render();</script></body></html>
